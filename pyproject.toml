[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "classin-dl"
version = "1.3.2"
description = "ClassIn 云端录课/课程回放下载工具"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "ClassIn-DL contributors" }]
keywords = ["classin", "eeo", "replay", "downloader", "m3u8"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["requests>=2.25.0"]

[project.optional-dependencies]
aes = ["pycryptodome>=3.15.0"]
cookies = ["browser-cookie3>=0.19.0"]

[project.scripts]
classin-dl = "classin_dl.cli:main"

[tool.setuptools]
packages = ["classin_dl"]
